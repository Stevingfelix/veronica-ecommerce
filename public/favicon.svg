<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D352E" />
      <stop offset="100%" stop-color="#1E2420" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9BC79A" />
      <stop offset="100%" stop-color="#6FA06E" />
    </linearGradient>
  </defs>

  <!-- Circular Badge Background with subtle border -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)" stroke="#4A5C4D" stroke-width="1.2" />

  <!-- Botanical Sprout / Ayurvedic Leaf Motif -->
  <g transform="translate(16, 16)">
    <!-- Right main curving leaf -->
    <path
      d="M0,7 C-0.5,3 -2,-1 -5,-3 C-1,-6 4,-6 7,-2 C8,2 6,5 0,7 Z"
      fill="url(#leafGrad)"
    />
    <!-- Left balancing leaf -->
    <path
      d="M-0.5,4 C-2,1.5 -5,0 -7,-2 C-7.5,-4.5 -5,-6 -2,-5 C0.5,-4 0.5,-1 -0.5,4 Z"
      fill="#A8D4A7"
      opacity="0.9"
    />
    <!-- Central leaf vein / golden stem -->
    <path
      d="M0,7 C-0.5,2 0,-2 3.5,-4.5"
      stroke="#F7F5F0"
      stroke-width="1.1"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Top delicate dewdrop -->
    <circle cx="3.5" cy="-6" r="1" fill="#F7F5F0" />
  </g>
</svg>

